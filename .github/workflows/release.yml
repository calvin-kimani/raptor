name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s" --reverse)
          else
            # Get commits since last tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --reverse)
          fi
          
          # Create release notes
          cat > release_notes.md << NOTES
          ## What's Changed
          
          $COMMITS
          
          ## Installation
          
          \`\`\`bash
          # Install this version
          curl -sSL https://raw.githubusercontent.com/calvin-kimani/raptor/main/install.sh | bash -s -- ${{ steps.get_version.outputs.VERSION }}
          
          # Or with git clone
          git clone https://github.com/calvin-kimani/raptor.git /tmp/raptor-install
          bash /tmp/raptor-install/install.sh ${{ steps.get_version.outputs.VERSION }}
          rm -rf /tmp/raptor-install
          \`\`\`
          
          ## Upgrading
          
          If you already have Raptor installed:
          
          \`\`\`bash
          raptor upgrade ${{ steps.get_version.outputs.VERSION }}
          \`\`\`
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
